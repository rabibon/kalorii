<style>
:root{--bg:#f3f5f1;--card:#fff;--text:#18201a;--muted:#6b766d;--line:#e3e8e1;--accent:#2f9e5b;--accent-2:#e6f4ec;--p:#3b82f6;--f:#f59e0b;--c:#a855f7;--warn:#e5484d;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1311;--card:#181d1a;--text:#e9efe9;--muted:#8d998f;--line:#29302b;--accent:#3fbf73;--accent-2:#173022;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 16px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 12px}
header .c{flex:1;text-align:center}
h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:18px;margin:8px 0 4px}
a{color:var(--accent)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.mut{color:var(--muted)}.sm{font-size:13px}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;background:var(--accent);color:#fff;width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.6}
.btn.sec{background:var(--accent-2);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--accent);font:inherit;padding:6px 0}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=checkbox]{width:22px;height:22px;flex:none;-webkit-appearance:auto;appearance:auto;accent-color:var(--accent)}
textarea{resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 13px;font:inherit;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:8px 4px;border-radius:10px;color:var(--text)}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .3s}
.br{margin:10px 0}
.brh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}
.top{display:flex;align-items:center;gap:16px}
.ringw{position:relative;width:128px;height:128px;flex:none}
.ringw svg{width:100%;height:100%}
.ringw .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringw .in b{font-size:26px;letter-spacing:-.02em;line-height:1.1}
.macros{flex:1;min-width:0}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item .it{flex:1;min-width:0}
.item .it div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--accent-2);display:flex;align-items:center;justify-content:center;font-size:20px}
.add{width:100%;margin-top:6px;border:1px dashed var(--line);background:none;color:var(--accent);font:inherit;font-weight:600;border-radius:12px;padding:10px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 20px rgba(47,158,91,.4);z-index:11}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
#tabs button{flex:1;max-width:180px;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
#tabs button.on{color:var(--accent)}
#tabs svg{width:24px;height:24px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.shh b{font-size:19px}
.photo{position:relative;display:flex;align-items:center;justify-content:center;min-height:150px;border:2px dashed var(--line);border-radius:16px;background:var(--card);text-align:center;color:var(--muted);overflow:hidden}
.photo img{width:100%;max-height:300px;object-fit:cover;display:block}
.photo input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.photo span{font-size:15px;padding:20px}
.photo span em{font-style:normal;font-size:34px;display:block}
.note{background:var(--accent-2);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0;white-space:pre-line}
.note.err{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--text)}
.note.warn{background:color-mix(in srgb,var(--f) 18%,transparent)}
.ri{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ri.off{opacity:.45}
.ri .rn{flex:1;min-width:0;padding:8px}
.ri .rg{width:70px;padding:8px;text-align:right}
.ri .rk{width:46px;text-align:right;font-size:15px}
.ri .x{border:0;background:none;color:var(--muted);font-size:18px;padding:4px}
.sr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.sr span:first-child{min-width:0}
.big{font-size:30px;font-weight:700;margin:12px 0 2px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:15px}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:11px;font:inherit}
.goal b{display:block;font-size:15px}.goal span{font-size:12px;color:var(--muted)}
.goal.on{border-color:var(--accent);background:var(--accent-2)}
.nrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.nrow .nn{flex:1}
.nrow input[type=number]{width:96px;padding:8px;text-align:right}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;position:relative;margin:10px 0 4px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .col i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px}
.chart .col i.over{background:var(--f)}
.chart .col.today i{outline:2px solid var(--text);outline-offset:1px}
.chart .tl{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted)}
.chart .tl span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--muted)}
.cl{display:flex;gap:4px}.cl span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.dl{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-top:1px solid var(--line)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
ol{padding-left:20px;margin:6px 0}ol li{margin:4px 0;font-size:14px}
.hero{text-align:center;padding:14px 0 6px}
.hero div{font-size:44px}
</style>
</head>

function microNorm(k,p,kcal){
  const m=p.sex==='m',a=p.age,teen=a<19;
  switch(k){
    case 'fiber':return Math.round(14*kcal/1000);
    case 'sugar':return Math.round(kcal*0.1/4);
    case 'iron':return teen?(m?11:15):(m?8:(a<=50?18:8));
    case 'calcium':return teen?1300:(m?(a<=70?1000:1200):(a<=50?1000:1200));
    case 'magnesium':return teen?(m?410:360):a<=30?(m?400:310):(m?420:320);
    case 'potassium':return teen?(m?3000:2300):(m?3400:2600);
    case 'zinc':return teen?(m?11:9):(m?11:8);
    case 'sodium':return 2300;
    case 'vitc':return teen?(m?75:65):(m?90:75);
    case 'vitd':return a>70?20:15;
    case 'b12':return 2.4;
  }
  return 0;
}
function autoTargets(){
  const p=S.profile;
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.activity,g=GOALS[p.goal]||GOALS.maintain;
  const kcal=Math.round(tdee*g.k/10)*10;
  const protein=Math.round(p.weight*g.p);
  const fat=Math.round(kcal*0.27/9);
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,protein,fat,carbs};
}
function targets(){
  const o=S.overrides||{},a=autoTargets(),t={...a};
  ['kcal','protein','fat','carbs'].forEach(k=>{if(o[k])t[k]=+o[k]});
  if(!o.carbs&&(o.kcal||o.protein||o.fat))t.carbs=Math.max(0,Math.round((t.kcal-t.protein*4-t.fat*9)/4));
  for(const k in MICRO)t[k]=o[k]?+o[k]:microNorm(k,S.profile,t.kcal);
  return t;
}

function aiPrompt(desc){return `Ты — опытный нутрициолог. Пользователь прислал фото еды и/или описание.
Задача: определить все продукты и блюда, оценить вес каждой позиции в граммах и посчитать пищевую ценность НА ВСЮ ПОРЦИЮ (не на 100 г).
Правила:
- Если в описании указан вес или количество — используй их, описание важнее фото.
- Если вес не указан — оцени по размеру посуды и типичным порциям.
- Учитывай способ приготовления (жарка, масло, соусы, сахар в напитках).
- Сложное блюдо давай одной позицией (например «Борщ»), отдельные продукты — отдельными позициями.
- Названия на русском, коротко.
- Если еды нет — верни пустой items и объясни в comment.
Ответь ТОЛЬКО JSON, без текста вокруг:
{"items":[{"name":"","grams":0,"kcal":0,"protein":0,"fat":0,"carbs":0,"fiber":0,"sugar":0,"iron":0,"calcium":0,"magnesium":0,"potassium":0,"zinc":0,"sodium":0,"vitc":0,"vitd":0,"b12":0}],"comment":""}
Единицы: grams, protein, fat, carbs, fiber, sugar — граммы; iron, calcium, magnesium, potassium, zinc, sodium, vitc — мг; vitd, b12 — мкг.
comment — одно короткое предложение (например, о неуверенности в весе) или пустая строка.`+(desc?`\n\nОписание от пользователя: ${desc}`:'\n\nОписания нет — только фото.')}

const models=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
async function callGemini(prompt,b64){
  let last;
  for(const m of models(S.settings.geminiModels)){
    try{
      const parts=[{text:prompt}];if(b64)parts.push({inline_data:{mime_type:'image/jpeg',data:b64}});
      const r=await fetchT(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.settings.geminiKey.trim()},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}})},90000);
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error?.message||('код '+r.status));
      const txt=(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
      if(!txt)throw new Error('пустой ответ');
      return parseAI(txt,'Gemini');
    }catch(e){last=new Error(`Gemini (${m}): ${e.message}`)}
  }
  throw last||new Error('Gemini: не указана модель');
}
async function callOR(prompt,dataUrl){
  let last;
  for(const m of models(S.settings.orModels)){
    try{
      const content=[{type:'text',text:prompt}];if(dataUrl)content.push({type:'image_url',image_url:{url:dataUrl}});
      const r=await fetchT('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.settings.orKey.trim(),'X-Title':'Kalorii'},body:JSON.stringify({model:m,temperature:0.2,messages:[{role:'user',content}]})},90000);
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error?.message||('код '+r.status));
      let txt=j.choices?.[0]?.message?.content;if(Array.isArray(txt))txt=txt.map(p=>p.text||'').join('');
      if(!txt)throw new Error('пустой ответ');
      return parseAI(txt,'OpenRouter');
    }catch(e){last=new Error(`OpenRouter (${m}): ${e.message}`)}
  }
  throw last||new Error('OpenRouter: не указана модель');
}
function parseAI(txt,src){
  const a=txt.indexOf('{'),b=txt.lastIndexOf('}');
  if(a<0||b<a)throw new Error('ответ не в формате JSON');
  let j;try{j=JSON.parse(txt.slice(a,b+1))}catch(e){throw new Error('не удалось прочитать ответ')}
  const items=(j.items||[]).map(it=>{const g=Math.max(1,num(it.grams)||100);const per100={};NK.forEach(k=>per100[k]=Math.max(0,num(it[k]))*100/g);return {name:String(it.name||'Блюдо').slice(0,80),grams:Math.round(g),per100,on:true}});
  if(!items.length)throw new Error(j.comment?('ничего не найдено — '+j.comment):'еда не распознана');
  return {items,comment:String(j.comment||''),src};
}
async function analyze(desc,dataUrl){
  const prompt=aiPrompt(desc),b64=dataUrl?dataUrl.split(',')[1]:null,errs=[];
  if(S.settings.geminiKey.trim()){try{return await callGemini(prompt,b64)}catch(e){errs.push(e.message)}}

}

  <div><label class="f">Рост, см</label><input type="number" inputmode="decimal" data-set="profile.height" value="${p.height}"></div>
  <div><label class="f">Вес, кг</label><input type="number" inputmode="decimal" data-set="profile.weight" value="${p.weight}"></div></div>
  <label class="f">Активность</label><select data-set="profile.activity">${ACT.map(([v,n])=>`<option value="${v}" ${+p.activity===v?'selected':''}>${n}</option>`).join('')}</select>
  <label class="f">Цель</label><div class="goals">${Object.entries(GOALS).map(([k,g])=>`<button class="goal ${p.goal===k?'on':''}" data-a="goal" data-g="${k}"><b>${g.n}</b><span>${g.d}</span></button>`).join('')}</div>`;
}

/* ----- Дневник ----- */
function ring(val,target){const r=54,c=2*Math.PI*r,p=target?Math.min(val/target,1):0,over=val>target*1.05;return `<svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="64" cy="64" r="${r}" fill="none" stroke="${over?'var(--warn)':'var(--accent)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}" transform="rotate(-90 64 64)"/></svg>`}
function barRow(name,val,target,unit,color,lim){const p=target?Math.min(val/target*100,100):0;const over=lim&&val>target;return `<div class="br"><div class="brh"><span>${name}</span><span class="mut">${fmt(val)} / ${fmt(target)} ${unit}${lim?' · макс.':''}</span></div><div class="bar"><i style="width:${p}%;background:${over?'var(--warn)':color}"></i></div></div>`}
function renderToday(){
  const t=targets(),tot=dayTotals(cur),left=Math.round(t.kcal-tot.kcal),entries=S.log[cur]||[];
  let h=`<header><button class="icon" data-a="day" data-n="-1" aria-label="Назад">‹</button><div class="c"><h1>${dayLabel(cur)}</h1>${cur!==todayKey()?'<button class="link sm" data-a="today">к сегодня</button>':`<div class="mut sm">${GOALS[S.profile.goal].n}</div>`}</div><button class="icon" data-a="day" data-n="1" aria-label="Вперёд">›</button></header>`;
  const days=Object.keys(S.log).filter(k=>S.log[k].length).sort();
  const since=S.settings.lastBackup||(days.length?parseKey(days[0]).getTime():Date.now());
  if(days.length&&Date.now()-since>7*864e5)h+=`<div class="note warn">💾 Давно не было бэкапа. Сохрани копию данных, чтобы ничего не потерять.<button class="btn sec" data-a="export" style="margin-top:8px">Сохранить бэкап</button></div>`;
  h+=`<div class="card"><div class="top"><div class="ringw">${ring(tot.kcal,t.kcal)}<div class="in"><b>${left>=0?left:'+'+(-left)}</b><span class="mut sm">${left>=0?'осталось':'сверх нормы'}</span></div></div>
  <div class="macros"><div class="mut sm">${Math.round(tot.kcal)} из ${t.kcal} ккал</div>
  ${barRow('Белки',tot.protein,t.protein,'г','var(--p)')}${barRow('Жиры',tot.fat,t.fat,'г','var(--f)')}${barRow('Углеводы',tot.carbs,t.carbs,'г','var(--c)')}</div></div></div>`;
  if(S.tracked.length)h+=`<div class="card"><div class="mh"><h2>Нутриенты</h2><button class="link sm" data-a="tab" data-tab="settings" data-sc="sec-nutr">настроить</button></div>${S.tracked.filter(k=>MICRO[k]).map(k=>barRow(MICRO[k].n,tot[k],t[k],MICRO[k].u,'var(--accent)',MICRO[k].lim)).join('')}</div>`;
  for(const [m,n,ic] of MEALS){
    const es=entries.filter(e=>e.meal===m),kc=es.reduce((s,e)=>s+entryVal(e,'kcal'),0);
    h+=`<div class="card"><div class="mh"><h2>${n}</h2><span class="mut">${Math.round(kc)} ккал</span></div>
    ${es.map(e=>`<div class="item" data-a="edit" data-id="${e.id}">${e.thumb?`<img class="th" src="${e.thumb}" alt="">`:`<div class="th">${ic}</div>`}<div class="it"><div>${esc(e.name)}</div><div class="mut sm">${Math.round(e.grams)} г · Б ${fmt(entryVal(e,'protein'))} · Ж ${fmt(entryVal(e,'fat'))} · У ${fmt(entryVal(e,'carbs'))}</div></div><b>${Math.round(entryVal(e,'kcal'))}</b></div>`).join('')}
    <button class="add" data-a="add" data-meal="${m}">+ Добавить</button></div>`;
  }
  return h;
}

/* ----- История ----- */
function renderHistory(){
  const t=targets(),tk=todayKey(),days=[];
  for(let i=13;i>=0;i--){const k=shiftKey(tk,-i);days.push([k,dayTotals(k).kcal])}
  const filled=days.filter(d=>d[1]>0),avg=filled.length?Math.round(filled.reduce((a,d)=>a+d[1],0)/filled.length):0;
  const max=Math.max(t.kcal*1.3,...days.map(d=>d[1]));
  let h=`<header><h1>История</h1></header><div class="card"><div class="mh"><h2>Калории за 14 дней</h2><span class="mut sm">в среднем ${avg} ккал</span></div>
  <div class="chart"><div class="tl" style="bottom:${t.kcal/max*100}%"><span>норма ${t.kcal}</span></div>${days.map(([k,v])=>`<div class="col ${k===tk?'today':''}" data-a="goday" data-k="${k}"><i class="${v>t.kcal*1.05?'over':''}" style="height:${v/max*100}%"></i></div>`).join('')}</div>
  <div class="cl">${days.map(([k])=>`<span>${parseKey(k).getDate()}</span>`).join('')}</div></div>`;
  const ws=Object.entries(S.weights).sort((a,b)=>a[0]<b[0]?1:-1);
  h+=`<div class="card"><h2>Вес</h2><div class="row"><input id="wv" type="number" inputmode="decimal" placeholder="${S.profile.weight} кг"><button class="btn" style="width:auto;margin:0" data-a="wadd">Записать</button></div>`;
  if(ws.length){const first=ws[ws.length-1][1],last=ws[0][1],d=Math.round((last-first)*10)/10;h+=`<p class="mut sm">Изменение с ${dayLabel(ws[ws.length-1][0])}: ${d>0?'+':''}${fmt(d)} кг</p>`+ws.slice(0,8).map(([k,v])=>`<div class="kv"><span>${dayLabel(k)}</span><b>${fmt(v)} кг</b></div>`).join('')}
  else h+=`<p class="mut sm">Записывай вес раз в несколько дней — нормы пересчитаются автоматически.</p>`;
  h+=`</div><div class="card"><h2>Дни</h2>`;
  const all=Object.keys(S.log).filter(k=>S.log[k].length).sort().reverse().slice(0,60);
  h+=all.length?all.map(k=>{const tt=dayTotals(k);return `<div class="dl" data-a="goday" data-k="${k}"><span>${dayLabel(k)}</span><span><b>${Math.round(tt.kcal)}</b> <span class="mut sm">ккал · Б ${Math.round(tt.protein)}</span></span></div>`}).join(''):'<p class="mut sm">Пока пусто.</p>';
  return h+'</div>';
}

  <div class="grid2">${[['kcal','Калории, ккал'],['protein','Белки, г'],['fat','Жиры, г'],['carbs','Углеводы, г']].map(([k,n])=>`<div><label class="f">${n}</label><input type="number" inputmode="decimal" data-set="overrides.${k}" value="${o[k]??''}" placeholder="${t[k]}"></div>`).join('')}</div></div>`;

  <label class="f">Ключ OpenRouter (запасной) — <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">получить</a></label>

  <button class="btn sec" data-a="testai" id="testai">Проверить ИИ</button></div>`;

  h+=`<div class="card"><h2>Данные</h2><p class="mut sm">Всё хранится на телефоне. Последний бэкап: ${st.lastBackup?new Date(st.lastBackup).toLocaleDateString('ru-RU'):'ни разу'}. Сохраняй файл в «Файлы» или iCloud Drive.</p>

/* ===== Шторка ===== */
function openSheet(html){const s=$('#sheet');const p=s.querySelector('.panel');const top=p?p.scrollTop:0;s.innerHTML=`<div class="panel">${html}</div>`;s.classList.remove('hidden');document.body.style.overflow='hidden';s.querySelector('.panel').scrollTop=top}
function closeSheet(){const s=$('#sheet');s.classList.add('hidden');s.innerHTML='';document.body.style.overflow='';A=null;E=null}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

/* ----- Добавление ----- */
function guessMeal(){const h=new Date().getHours();return h<11?'breakfast':h<16?'lunch':h<21?'dinner':'snack'}
function openAdd(meal){A={meal:meal||guessMeal(),mode:hasKey()?'ai':'search',img:null,thumb:null,desc:'',items:null,comment:'',src:'',err:'',busy:false,q:'',list:[],pick:null};drawAdd()}
function drawAdd(){
  if(!A)return;
  openSheet(`<div class="shh"><b>Добавить · ${dayLabel(cur).toLowerCase()}</b><button class="icon" data-a="close">✕</button></div>
  <div class="chips">${MEALS.map(([m,n])=>`<button class="chip ${A.meal===m?'on':''}" data-a="ameal" data-m="${m}">${n}</button>`).join('')}</div>
  <div class="seg">${[['ai','📷 Фото / ИИ'],['search','🔍 Поиск'],['manual','✏️ Вручную']].map(([k,n])=>`<button class="${A.mode===k?'on':''}" data-a="amode" data-m="${k}">${n}</button>`).join('')}</div>
  ${A.mode==='ai'?addAI():A.mode==='search'?addSearch():addManual()}`);
}
function addAI(){
  let h='';
  if(!hasKey())h+=`<div class="note">Чтобы распознавать фото, добавь бесплатный ключ ИИ в разделе <button class="link" data-a="tab" data-tab="settings" data-sc="sec-ai">Профиль → ИИ</button>. Без ключа работают поиск и ручной ввод.</div>`;
  h+=`<div class="photo">${A.img?`<img src="${A.img}" alt="">`:'<span><em>📷</em>Сфотографировать или выбрать фото</span>'}<input type="file" accept="image/*" id="aphoto"></div>`;
  if(A.img)h+=`<button class="link sm" data-a="noimg">Убрать фото</button>`;
  h+=`<label class="f">Описание (необязательно, но повышает точность)</label><textarea id="adesc" rows="2" placeholder="Например: гречка 200 г, 2 яйца, без масла">${esc(A.desc)}</textarea>
  <button class="btn" data-a="analyze" ${A.busy?'disabled':''}>${A.busy?'<span class="spin"></span> Распознаю…':'Распознать'}</button>`;
  if(A.err)h+=`<div class="note err">${esc(A.err)}</div>`;
  if(A.items){
    h+=`<div class="card" style="margin-top:12px"><div class="mh"><h2>Что нашлось</h2><span class="mut sm">${esc(A.src)}</span></div><p class="mut sm" style="margin:0 0 4px">Проверь названия и вес — калории пересчитаются.</p>
    ${A.items.map((it,i)=>`<div class="ri ${it.on?'':'off'}" id="ri${i}"><input type="checkbox" data-a="aitog" data-i="${i}" ${it.on?'checked':''}><input class="rn" data-ai="name" data-i="${i}" value="${esc(it.name)}"><input class="rg" type="number" inputmode="decimal" data-ai="grams" data-i="${i}" value="${it.grams}"><span class="sm mut">г</span><b class="rk" id="rk${i}">${Math.round(it.per100.kcal*it.grams/100)}</b></div>`).join('')}
    ${A.comment?`<div class="note">${esc(A.comment)}</div>`:''}
    <div class="kv"><span>Итого</span><b id="rtot">${aiTotal()}</b></div>
    <label class="chk"><input type="checkbox" id="asavemy"> Сохранить в «Мои продукты»</label>
    <button class="btn" data-a="aadd">Добавить в «${MEALN[A.meal]}»</button></div>`;
  }
  return h;
}
const aiTotal=()=>{const on=A.items.filter(i=>i.on);const s=k=>on.reduce((a,i)=>a+i.per100[k]*i.grams/100,0);return `${Math.round(s('kcal'))} ккал · Б ${Math.round(s('protein'))} · Ж ${Math.round(s('fat'))} · У ${Math.round(s('carbs'))}`};
function recentFoods(){const seen=new Set(),out=[];const keys=Object.keys(S.log).sort().reverse().slice(0,30);for(const k of keys)for(const e of [...S.log[k]].reverse()){if(seen.has(e.name))continue;seen.add(e.name);out.push({name:e.name,per100:e.per100,grams:e.grams,recent:true});if(out.length>=12)return out}return out}
function addSearch(){
  if(A.pick)return pickView();
  return `<input id="sq" type="search" placeholder="Название продукта или блюда" value="${esc(A.q)}" autocomplete="off"><div id="sres">${searchRes()}</div>`;
}
function searchRes(){
  const q=A.q.trim().toLowerCase();let list,title='';
  const all=[...S.myFoods.map(f=>({...f,my:true})),...FOODS];
  if(!q){const r=recentFoods();list=r.length?r:all.slice(0,30);title=r.length?'Недавние':'Популярное'}
  else{const words=q.split(/\s+/);list=all.filter(f=>{const n=f.name.toLowerCase();return words.every(w=>n.includes(w))});list.sort((a,b)=>(b.name.toLowerCase().startsWith(q)?1:0)-(a.name.toLowerCase().startsWith(q)?1:0))}
  A.list=list.slice(0,60);
  if(!A.list.length)return `<p class="mut">Ничего не найдено. Попробуй «Фото / ИИ» с описанием или «Вручную».</p>`;
  return (title?`<p class="mut sm" style="margin:10px 0 0">${title}</p>`:'')+A.list.map((f,i)=>`<div class="sr" data-a="pick" data-i="${i}"><span>${f.my?'★ ':''}${esc(f.name)}${f.recent?` <span class="mut sm">· ${Math.round(f.grams)} г</span>`:''}</span><span class="mut sm" style="white-space:nowrap">${Math.round(f.per100.kcal)} ккал/100 г</span></div>`).join('');
}
function pickView(){
  const f=A.pick;
  return `<button class="link" data-a="unpick">‹ К поиску</button><h3>${esc(f.name)}</h3>
  <div class="mut sm">На 100 г: ${Math.round(f.per100.kcal)} ккал · Б ${fmt(f.per100.protein)} · Ж ${fmt(f.per100.fat)} · У ${fmt(f.per100.carbs)}</div>
  <label class="f">Вес порции, г</label><input id="pg" type="number" inputmode="decimal" value="${f.grams}">
  ${f.piece?`<div class="chips">${[1,2,3].map(n=>`<button class="chip" data-a="pcs" data-n="${n}">${n} шт (${n*f.piece} г)</button>`).join('')}</div>`:''}
  <div class="big" id="pk">${Math.round(f.per100.kcal*f.grams/100)} ккал</div><div class="mut sm" id="pm">${pickMacros(f.grams)}</div>
  <button class="btn" data-a="padd">Добавить в «${MEALN[A.meal]}»</button>`;
}
const pickMacros=g=>{const p=A.pick.per100;return `Б ${fmt(p.protein*g/100)} · Ж ${fmt(p.fat*g/100)} · У ${fmt(p.carbs*g/100)}`};
function addManual(){

  <button class="btn danger" data-a="edel">Удалить</button>`);
}
function editTable(){const e=E,v=k=>e.per100[k]*e.grams/100;return `<div class="kv"><span>Калории</span><b>${Math.round(v('kcal'))} ккал</b></div><div class="kv"><span>Белки</span><b>${fmt(v('protein'))} г</b></div><div class="kv"><span>Жиры</span><b>${fmt(v('fat'))} г</b></div><div class="kv"><span>Углеводы</span><b>${fmt(v('carbs'))} г</b></div>`+Object.entries(MICRO).map(([k,m])=>`<div class="kv"><span class="mut">${m.n}</span><span>${fmt(v(k))} ${m.u}</span></div>`).join('')}

/* ===== Экспорт / импорт ===== */
async function exportData(){
  const json=JSON.stringify({app:'kalorii',v:1,exported:new Date().toISOString(),data:S});
  const name=`kalorii-backup-${todayKey()}.json`,file=new File([json],name,{type:'application/json'});
  const done=()=>{S.settings.lastBackup=Date.now();save();render();toast('Бэкап сохранён')};
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Бэкап трекера калорий'});done();return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);done();
}
async function importData(file){
  try{const j=JSON.parse(await file.text());const d=j.data||j;if(!d||typeof d.log!=='object')throw 0;
    if(!confirm('Заменить текущие данные данными из бэкапа?'))return;
    S=merge(defState(),d);await flush();render();toast('Данные восстановлены')}
  catch(e){toast('Это не файл бэкапа')}
}

/* ===== События ===== */
const ACTIONS={
  tab(el){tab=el.dataset.tab;closeSheet();render();window.scrollTo(0,0);if(el.dataset.sc)setTimeout(()=>document.getElementById(el.dataset.sc)?.scrollIntoView({behavior:'smooth'}),50)},
  day(el){cur=shiftKey(cur,+el.dataset.n);render()},
  today(){cur=todayKey();render()},
  goday(el){cur=el.dataset.k;tab='today';render();window.scrollTo(0,0)},
  goal(el){S.profile.goal=el.dataset.g;save();render()},
  onbdone(){S.onboarded=true;save();render();try{navigator.storage?.persist?.()}catch(e){}},
  add(el){openAdd(el.dataset.meal)},
  close(){closeSheet()},
  ameal(el){A.meal=el.dataset.m;drawAdd()},
  amode(el){A.mode=el.dataset.m;A.pick=null;drawAdd()},
  noimg(){A.img=A.thumb=null;drawAdd()},
  async analyze(){
    if(A.busy)return;
    const d=$('#adesc');if(d)A.desc=d.value;
    if(!A.img&&!A.desc.trim()){toast('Добавь фото или описание');return}
    if(!hasKey()){A.err='Нет ключа ИИ. Добавь его в разделе Профиль → ИИ для фото.';drawAdd();return}
    A.busy=true;A.err='';A.items=null;drawAdd();const ctx=A;
    try{const r=await analyze(A.desc.trim(),A.img);ctx.items=r.items;ctx.comment=r.comment;ctx.src=r.src}
    catch(e){ctx.err='Не получилось распознать:\n'+e.message+'\n\nПопробуй ещё раз, добавь описание или воспользуйся поиском.'}
    ctx.busy=false;if(A===ctx)drawAdd();
  },
  aitog(el){const it=A.items[+el.dataset.i];it.on=el.checked;$('#ri'+el.dataset.i).classList.toggle('off',!it.on);$('#rtot').textContent=aiTotal()},
  aadd(){
    const on=A.items.filter(i=>i.on&&i.grams>0);if(!on.length){toast('Ничего не выбрано');return}
    const my=$('#asavemy')?.checked;
    on.forEach(it=>{pushEntry({meal:A.meal,name:it.name.trim()||'Блюдо',grams:it.grams,per100:it.per100,thumb:A.thumb,src:'ai'});if(my)saveMy(it.name.trim()||'Блюдо',it.per100)});
    finishAdd(`Добавлено: ${Math.round(on.reduce((a,i)=>a+i.per100.kcal*i.grams/100,0))} ккал`);
  },
  pick(el){const f=A.list[+el.dataset.i];A.pick={...f,grams:f.grams||f.piece||100};drawAdd();setTimeout(()=>$('#pg')?.focus(),60)},
  unpick(){A.pick=null;drawAdd()},
  pcs(el){const g=+el.dataset.n*A.pick.piece;$('#pg').value=g;A.pick.grams=g;$('#pk').textContent=Math.round(A.pick.per100.kcal*g/100)+' ккал';$('#pm').textContent=pickMacros(g)},
  padd(){const g=num($('#pg').value);if(g<=0){toast('Укажи вес');return}const f=A.pick;pushEntry({meal:A.meal,name:f.name,grams:g,per100:{...f.per100},src:'db'});finishAdd(`Добавлено: ${Math.round(f.per100.kcal*g/100)} ккал`)},
  madd(){
    const name=$('#m_name').value.trim(),g=num($('#m_grams').value);
    if(!name){toast('Введи название');return}if(g<=0){toast('Укажи вес');return}
    const per100={};NK.forEach(k=>{const el=$('#m_'+k);per100[k]=el?num(el.value)*100/g:0});
    if(!per100.kcal)per100.kcal=per100.protein*4+per100.fat*9+per100.carbs*4;
    pushEntry({meal:A.meal,name,grams:g,per100,src:'manual'});if($('#m_save').checked)saveMy(name,per100);
    finishAdd(`Добавлено: ${Math.round(per100.kcal*g/100)} ккал`);
  },
  edit(el){openEdit(el.dataset.id)},
  emeal(el){E.meal=el.dataset.m;E.name=$('#e_name').value;E.grams=num($('#e_grams').value)||E.grams;drawEdit()},
  esave(){const list=S.log[cur]||[],i=list.findIndex(x=>x.id===E.id);if(i<0)return;E.name=$('#e_name').value.trim()||E.name;const g=num($('#e_grams').value);if(g>0)E.grams=g;list[i]=E;save();closeSheet();render();toast('Сохранено')},
  emy(){saveMy($('#e_name').value.trim()||E.name,E.per100);save();toast('Сохранено в «Мои продукты»')},
  edel(){if(!confirm('Удалить запись?'))return;S.log[cur]=(S.log[cur]||[]).filter(x=>x.id!==E.id);if(!S.log[cur].length)delete S.log[cur];save();closeSheet();render();toast('Удалено')},
  trk(el){const k=el.dataset.k;S.tracked=el.checked?[...new Set([...S.tracked,k])]:S.tracked.filter(x=>x!==k);save()},
  mydel(el){S.myFoods.splice(+el.dataset.i,1);save();render()},
  wadd(){const v=num($('#wv').value);if(v<30||v>300){toast('Введи вес в кг');return}S.weights[todayKey()]=Math.round(v*10)/10;S.profile.weight=Math.round(v*10)/10;save();render();toast('Вес записан, нормы пересчитаны')},
  export(){exportData()},
  wipe(){if(!confirm('Удалить ВСЕ данные? Это нельзя отменить.'))return;if(!confirm('Точно? Лучше сначала сохрани бэкап.'))return;const keep=S.settings;S=defState();S.settings={...S.settings,geminiKey:keep.geminiKey,orKey:keep.orKey};flush();render();toast('Данные удалены')},
  async testai(el){
    if(!hasKey()){toast('Сначала вставь ключ');return}
    el.disabled=true;el.innerHTML='<span class="spin" style="border-top-color:var(--accent)"></span> Проверяю…';
    try{const r=await analyze('1 банан среднего размера',null);toast(`✅ ${r.src} работает: ${r.items[0].name} — ${Math.round(r.items[0].per100.kcal*r.items[0].grams/100)} ккал`)}
    catch(e){alert('ИИ не ответил:\n\n'+e.message)}
    el.disabled=false;el.textContent='Проверить ИИ';
  }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=ACTIONS[el.dataset.a];if(!fn)return;if(el.tagName!=='INPUT')e.preventDefault();fn(el,e)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='adesc'&&A)A.desc=t.value;
  else if(t.id==='sq'&&A){A.q=t.value;$('#sres').innerHTML=searchRes()}
  else if(t.dataset.ai&&A&&A.items){const it=A.items[+t.dataset.i];if(t.dataset.ai==='name')it.name=t.value;else{it.grams=Math.max(0,num(t.value));$('#rk'+t.dataset.i).textContent=Math.round(it.per100.kcal*it.grams/100);$('#rtot').textContent=aiTotal()}}
  else if(t.id==='pg'&&A&&A.pick){const g=num(t.value);A.pick.grams=g;$('#pk').textContent=Math.round(A.pick.per100.kcal*g/100)+' ккал';$('#pm').textContent=pickMacros(g)}
  else if(t.id==='e_grams'&&E){const g=num(t.value);if(g>0){E.grams=g;$('#e_tab').innerHTML=editTable()}}
});
const LIM={'profile.age':[14,100],'profile.height':[120,230],'profile.weight':[30,300]};
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='aphoto'&&t.files[0]&&A){try{const img=await loadImg(t.files[0]);A.img=shrink(img,1024,0.8);A.thumb=shrink(img,180,0.6);A.items=null;A.err='';URL.revokeObjectURL(img.src);drawAdd()}catch(err){toast(err.message)}return}
  if(t.id==='impf'&&t.files[0]){importData(t.files[0]);t.value='';return}
  const path=t.dataset.set;if(!path)return;
  const [obj,key]=path.split('.');
  let val=t.value;
  if(obj==='overrides'){if(String(val).trim()===''||num(val)<=0)delete S.overrides[key];else S.overrides[key]=num(val)}
  else if(obj==='profile'){if(key!=='sex'){val=num(val);const l=LIM[path];if(l){if(!val){render();return}val=Math.min(l[1],Math.max(l[0],val))}}S.profile[key]=val}
  else if(obj==='settings')S.settings[key]=String(val).trim();
  save();
  if(obj!=='settings'){const y=window.scrollY;render();window.scrollTo(0,y)}
});

/* ===== Запуск ===== */
(async()=>{
  await load();render();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  let last=todayKey();setInterval(()=>{const t=todayKey();if(t!==last){if(cur===last)cur=t;last=t;if(!$('#sheet').classList.contains('hidden'))return;render()}},60000);
})();
</script>
